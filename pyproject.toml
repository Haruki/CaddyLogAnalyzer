[project]
name = "caddyloganalyzer"
version = "0.1.0"
description = "DuckDB-backed pipeline for Caddy access log analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<2",
    "fastapi[standard]>=0.143.3",
    # required by DuckDB's Python client for interval/calendar SQL (generate_series)
    "pytz>=2026.5",
    # offline GeoLite2 lookups for the ip_enrichment step in alert.py
    "geoip2>=5,<6",
]
