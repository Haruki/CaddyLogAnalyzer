<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaddyLog</title>
  <link rel="icon" href="data:,"><!-- suppress favicon request noise -->
  <link rel="stylesheet" href="/vendor/uplot.min.css">
  <link rel="stylesheet" href="/style.css">
  <!-- uPlot as a classic script (defines global `uPlot`); app.js is an ES module,
       which browsers always run after classic scripts — no build step involved. -->
  <script src="/vendor/uplot.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">CaddyLog<span class="brand-sub">access-event dashboard</span></div>
  <div class="freshness" id="freshness">
    <span class="dot dot-muted" id="status-dot"></span>
    <span id="freshness-text">loading…</span>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="time window">
  <button data-window="5m">5 min</button>
  <button data-window="1h" class="active">1 hour</button>
  <button data-window="1d">24 h</button>
  <button data-window="30d">30 days</button>
  <button data-window="year" id="btn-year"></button>
  <span class="tabs-spacer"></span>
  <button id="refresh-btn" title="Refresh now">&#8635; refresh</button>
</nav>

<main>
  <section class="grid">
    <article class="card card-chart">
    <h2>requests <span id="range-label"></span><span class="muted" id="chart-sub"></span></h2>
    <div id="crumbs" aria-label="drill path"></div>
    <div id="chart"><p class="empty hidden" id="chart-empty">no data in this window</p></div>
    </article>

    <article class="card card-totals">
      <h2>total requests</h2>
      <div class="big-number" id="total-count">&ndash;</div>
      <ul class="status-classes" id="status-classes"></ul>
    </article>

    <article class="card card-hosts">
      <h2>top hosts</h2>
      <ol class="hosts" id="top-hosts"><li class="muted">loading…</li></ol>
    </article>
  </section>

  <section class="card card-anomalies">
    <h2>anomalies <span class="badge badge-zero" id="anomaly-count">0</span></h2>
    <ul class="findings" id="anomaly-list"><li class="muted">loading…</li></ul>
  </section>

  <!-- Drill-down: raw log rows for a clicked anomaly (populated by app.js) -->
  <section class="card card-drilldown hidden" id="drilldown">
    <h2>
      drill-down <span class="muted mono" id="drilldown-query"></span>
      <button class="close-btn" id="drilldown-close" title="Close (Esc)">&times;</button>
    </h2>
    <div class="table-wrap">
      <table class="events" id="event-table">
        <thead>
          <tr><th>time</th><th>ip</th><th>host</th><th>method</th><th>path</th><th>status</th><th>bytes</th></tr>
        </thead>
        <tbody id="event-rows"></tbody>
      </table>
    </div>
  </section>
</main>

</body>
</html>
